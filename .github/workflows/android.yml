name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Build app native libraries
        run: |
          chmod +x gradlew
          ./gradlew runNdkBuild --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug -x runNdkBuild --no-daemon

      - name: Verify required native libraries in debug APK
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libbyedpi.so libhev-socks5-tunnel.so libtgwsproxy.so; do
              unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/$abi/$lib"
            done
          done

      - name: Build unsigned release APK
        run: |
          ./gradlew assembleRelease -x runNdkBuild --no-daemon

      - name: Verify required native libraries in release APK
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libbyedpi.so libhev-socks5-tunnel.so libtgwsproxy.so; do
              unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -q "lib/$abi/$lib"
            done
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zapret2UI-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload internal unsigned release APK for feature-branch testing
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-unsigned-release-do-not-install
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      # Public installable APKs are signed separately with the persistent release key.
